<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc"><title id="title">La Terre et la Lune à l’échelle</title><desc id="desc">Schéma pédagogique montrant les rapports approximatifs entre diamètres et distance moyenne Terre-Lune.</desc><rect width="1000" height="430" fill="#071326"/><circle cx="180" cy="215" r="100" fill="#4e8ed8" stroke="white" stroke-width="2"/><circle cx="790" cy="215" r="25" fill="#ddd" stroke="white" stroke-width="2"/><line x1="280" y1="215" x2="765" y2="215" stroke="#ffd35a" stroke-width="3" stroke-dasharray="8 8"/><g fill="white" font-family="sans-serif" text-anchor="middle" font-size="19"><text x="180" y="350">Terre</text><text x="790" y="275">Lune</text><text x="500" y="175">Distance moyenne : 384 400 km</text><text x="500" y="400">Diamètre lunaire ≈ 1/4 du diamètre terrestre ; schéma non à l’échelle exacte.</text></g></svg>