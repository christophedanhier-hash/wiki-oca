<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc"><title id="title">Du ciel visible à l’explication scientifique</title><desc id="desc">Schéma pédagogique de la méthode d’un guide astro en trois étapes.</desc><rect width="1000" height="330" fill="#071326"/><g font-family="sans-serif" text-anchor="middle"><rect x="80" y="100" width="230" height="100" rx="16" fill="#2d6a8c"/><rect x="385" y="100" width="230" height="100" rx="16" fill="#437d55"/><rect x="690" y="100" width="230" height="100" rx="16" fill="#8b5e3c"/><g fill="white" font-size="21"><text x="195" y="145">1. Observer</text><text x="195" y="175">Ce que voit le public</text><text x="500" y="145">2. Expliquer</text><text x="500" y="175">Une notion exacte</text><text x="805" y="145">3. Relier</text><text x="805" y="175">À une expérience</text></g><g stroke="#ffd35a" stroke-width="4" marker-end="url(#a)"><line x1="310" y1="150" x2="380" y2="150"/><line x1="615" y1="150" x2="685" y2="150"/></g><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#ffd35a"/></marker></defs><text x="500" y="270" fill="#b9cbe2" font-size="17">Méthode proposée pour structurer une réponse de guide astro</text></g></svg>