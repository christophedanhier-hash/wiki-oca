<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 370" role="img" aria-labelledby="t d"><title id="t">Estimer le nombre d’étoiles</title><desc id="d">Chaîne de raisonnement pédagogique allant d’une galaxie à une estimation de l’Univers observable.</desc><rect width="1000" height="370" fill="#071326"/><g font-family="sans-serif" text-anchor="middle" fill="white"><rect x="60" y="130" width="180" height="80" rx="14" fill="#704c8b"/><rect x="300" y="130" width="180" height="80" rx="14" fill="#437d55"/><rect x="540" y="130" width="180" height="80" rx="14" fill="#2d6a8c"/><rect x="780" y="130" width="160" height="80" rx="14" fill="#8b5e3c"/><text x="150" y="165" font-size="19">Étoiles</text><text x="150" y="190">par galaxie</text><text x="390" y="165" font-size="19">Galaxies</text><text x="390" y="190">observables</text><text x="630" y="165" font-size="19">Produit</text><text x="630" y="190">d’ordres de grandeur</text><text x="860" y="165" font-size="19">Estimation</text><text x="860" y="190">≈ 10²³</text><g stroke="#ffd35a" stroke-width="4" marker-end="url(#a)"><line x1="240" y1="170" x2="295" y2="170"/><line x1="480" y1="170" x2="535" y2="170"/><line x1="720" y1="170" x2="775" y2="170"/></g><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#ffd35a"/></marker></defs><text x="500" y="300" font-size="17" fill="#b9cbe2">Ce n’est pas un comptage direct : c’est une estimation de l’Univers observable.</text></g></svg>