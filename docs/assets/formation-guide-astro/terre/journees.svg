<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc"><title id="title">Journée solaire et journée sidérale</title><desc id="desc">Schéma montrant pourquoi la Terre doit tourner un peu plus pour retrouver le Soleil après un tour par rapport aux étoiles.</desc><rect width="1000" height="430" fill="#071326"/><circle cx="500" cy="220" r="120" fill="none" stroke="#789" stroke-dasharray="7 8"/><circle cx="500" cy="220" r="36" fill="#4e8ed8" stroke="white" stroke-width="2"/><circle cx="720" cy="220" r="30" fill="#ffd35a"/><circle cx="720" cy="110" r="4" fill="white"/><path d="M536 220 A184 184 0 0 1 535 200" fill="none" stroke="#ff8a65" stroke-width="4"/><path d="M500 185 L500 120" stroke="#ff8a65" stroke-width="3" marker-end="url(#a)"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#ff8a65"/></marker></defs><g fill="white" font-family="sans-serif" text-anchor="middle" font-size="18"><text x="500" y="220">Terre</text><text x="720" y="260">Soleil</text><text x="720" y="85">Étoile lointaine</text><text x="500" y="35">Après une rotation par rapport aux étoiles : journée sidérale ≈ 23 h 56 min</text><text x="500" y="400">La Terre avance aussi sur son orbite : environ 4 minutes supplémentaires pour retrouver le Soleil.</text></g></svg>