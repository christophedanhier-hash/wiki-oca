<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc"><title id="title">Les saisons et l’inclinaison de l’axe terrestre</title><desc id="desc">Schéma pédagogique montrant quatre positions de la Terre autour du Soleil, avec un axe conservant son orientation.</desc><rect width="1000" height="500" fill="#071326"/><circle cx="500" cy="250" r="55" fill="#ffd35a" stroke="#fff0a8" stroke-width="3"/><circle cx="500" cy="95" r="30" fill="#4e8ed8" stroke="white" stroke-width="2"/><circle cx="655" cy="250" r="30" fill="#4e8ed8" stroke="white" stroke-width="2"/><circle cx="500" cy="405" r="30" fill="#4e8ed8" stroke="white" stroke-width="2"/><circle cx="345" cy="250" r="30" fill="#4e8ed8" stroke="white" stroke-width="2"/><circle cx="500" cy="250" r="155" fill="none" stroke="#789" stroke-dasharray="7 8"/><g stroke="#ff8a65" stroke-width="3"><line x1="487" y1="68" x2="513" y2="122"/><line x1="642" y1="223" x2="668" y2="277"/><line x1="487" y1="378" x2="513" y2="432"/><line x1="332" y1="223" x2="358" y2="277"/></g><g fill="white" font-family="sans-serif" font-size="18" text-anchor="middle"><text x="500" y="45">Été Nord</text><text x="705" y="255">Automne Nord</text><text x="500" y="465">Hiver Nord</text><text x="295" y="255">Printemps Nord</text><text x="500" y="255">Soleil</text></g><text x="500" y="490" fill="#b9cbe2" font-family="sans-serif" font-size="15" text-anchor="middle">L’axe terrestre reste orienté dans la même direction : l’inclinaison modifie la hauteur du Soleil et la durée du jour.</text></svg>