<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc"><title id="title">Structure interne simplifiée de la Terre et magnétosphère</title><desc id="desc">Schéma pédagogique des principales couches terrestres et de l’interaction avec le vent solaire.</desc><rect width="1000" height="430" fill="#071326"/><circle cx="300" cy="220" r="150" fill="#8b5e3c" stroke="#d7ecff" stroke-width="3"/><circle cx="300" cy="220" r="105" fill="#cf7b4a"/><circle cx="300" cy="220" r="57" fill="#ffd35a"/><g fill="white" font-family="sans-serif" font-size="17"><text x="300" y="220" text-anchor="middle">Noyau interne</text><text x="300" y="145" text-anchor="middle">Noyau externe</text><text x="300" y="75" text-anchor="middle">Manteau + croûte</text></g><path d="M470 220 C620 80 820 100 930 220 C820 340 620 360 470 220" fill="none" stroke="#64c7ff" stroke-width="5"/><path d="M470 220 C620 120 820 130 930 220" fill="none" stroke="#64c7ff" stroke-width="2" stroke-dasharray="8 7"/><path d="M60 220 H210" stroke="#ffd35a" stroke-width="5" marker-end="url(#a)"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#ffd35a"/></marker></defs><g fill="white" font-family="sans-serif" text-anchor="middle" font-size="18"><text x="760" y="65">Magnétosphère</text><text x="100" y="205">Vent solaire</text><text x="300" y="405">Schéma simplifié, non à l’échelle</text></g></svg>