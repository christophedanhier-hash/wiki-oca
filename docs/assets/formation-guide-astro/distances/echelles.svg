<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="t d"><title id="t">Échelles de distance en astronomie</title><desc id="d">Schéma montrant l’usage de l’unité astronomique, de l’année-lumière et du parsec selon l’échelle.</desc><rect width="1000" height="360" fill="#071326"/><g font-family="sans-serif" fill="white" text-anchor="middle"><line x1="100" y1="180" x2="900" y2="180" stroke="#ffd35a" stroke-width="5"/><circle cx="180" cy="180" r="25" fill="#4e8ed8"/><circle cx="450" cy="180" r="25" fill="#ffd35a"/><circle cx="760" cy="180" r="25" fill="#ddd"/><text x="180" y="240" font-size="18">Terre</text><text x="450" y="240" font-size="18">Soleil</text><text x="760" y="240" font-size="18">Étoile</text><text x="315" y="125" font-size="21">ua</text><text x="605" y="125" font-size="21">année-lumière</text><text x="850" y="125" font-size="21">parsec</text><text x="500" y="45" font-size="22">Changer d’unité quand l’échelle change</text><text x="500" y="315" font-size="16" fill="#b9cbe2">Le parsec est lié à la mesure de parallaxe ; 1 pc ≈ 3,26 années-lumière.</text></g></svg>