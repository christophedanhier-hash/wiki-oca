<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
<title id="title">Principe simplifié des marées</title>
<desc id="desc">Schéma simplifié montrant deux bourrelets de marée et le renforcement des effets du Soleil et de la Lune.</desc>
<rect width="1000" height="430" fill="#071326"/><text x="500" y="35" fill="white" font-family="sans-serif" font-size="22" text-anchor="middle">Principe simplifié des marées — schéma non à l’échelle</text><ellipse cx="500" cy="235" rx="170" ry="105" fill="#3b78b4" stroke="#d7ecff" stroke-width="3"/><ellipse cx="500" cy="235" rx="190" ry="62" fill="#67b7e8" opacity=".65"/><circle cx="500" cy="235" r="63" fill="#4e8ed8" stroke="white" stroke-width="2"/><circle cx="100" cy="235" r="38" fill="#ffd35a"/><circle cx="850" cy="235" r="28" fill="#ddd"/><g fill="white" font-family="sans-serif" text-anchor="middle" font-size="17"><text x="100" y="290">Soleil</text><text x="850" y="290">Lune</text><text x="500" y="242">Terre</text><text x="500" y="105">Bourrelet de marée</text><text x="500" y="385">Lune et Soleil alignés : effets renforcés, vives-eaux.</text></g><path d="M145 235H805" stroke="#ffd35a" stroke-width="2" stroke-dasharray="7 7"/><text x="500" y="415" fill="#b9cbe2" font-family="sans-serif" font-size="14" text-anchor="middle">La hauteur réelle dépend aussi des côtes, des fonds marins et de la géographie locale.</text></svg>