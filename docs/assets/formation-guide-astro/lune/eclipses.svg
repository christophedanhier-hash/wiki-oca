<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
<title id="title">Comparaison des éclipses de Lune et de Soleil</title>
<desc id="desc">Deux schémas montrant les alignements Soleil Terre Lune pour une éclipse lunaire et Soleil Lune Terre pour une éclipse solaire.</desc>
<rect width="1000" height="430" fill="#071326"/><g font-family="sans-serif" fill="white" text-anchor="middle" font-size="20"><text x="250" y="35">Éclipse de Lune</text><text x="750" y="35">Éclipse de Soleil</text></g><g stroke="#ffd35a" stroke-width="5"><line x1="80" y1="170" x2="420" y2="170"/><line x1="580" y1="170" x2="920" y2="170"/></g><circle cx="100" cy="170" r="38" fill="#ffd35a"/><circle cx="250" cy="170" r="35" fill="#4e8ed8" stroke="white" stroke-width="2"/><circle cx="400" cy="170" r="25" fill="#ddd" stroke="white" stroke-width="2"/><circle cx="600" cy="170" r="38" fill="#ffd35a"/><circle cx="750" cy="170" r="25" fill="#ddd" stroke="white" stroke-width="2"/><circle cx="900" cy="170" r="35" fill="#4e8ed8" stroke="white" stroke-width="2"/><g fill="white" font-family="sans-serif" text-anchor="middle" font-size="16"><text x="100" y="235">Soleil</text><text x="250" y="235">Terre</text><text x="400" y="235">Lune</text><text x="600" y="235">Soleil</text><text x="750" y="235">Lune</text><text x="900" y="235">Terre</text></g><path d="M270 170 L395 145 L395 195 Z" fill="#39465b" opacity=".8"/><path d="M765 170 L895 145 L895 195 Z" fill="#39465b" opacity=".8"/><g fill="#b9cbe2" font-family="sans-serif" font-size="16" text-anchor="middle"><text x="250" y="290">L’ombre de la Terre tombe sur la Lune.</text><text x="750" y="290">L’ombre de la Lune tombe sur une partie de la Terre.</text><text x="500" y="370">Les éclipses exigent un alignement précis ; l’orbite lunaire est inclinée d’environ 5° par rapport à l’écliptique.</text></g></svg>