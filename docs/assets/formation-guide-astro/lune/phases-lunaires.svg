<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
<title id="title">Les principales phases de la Lune</title>
<desc id="desc">Schéma pédagogique montrant la position de la Lune autour de la Terre et les phases vues depuis la Terre.</desc>
<rect width="1000" height="520" fill="#071326"/><circle cx="500" cy="260" r="52" fill="#4e8ed8" stroke="#d7ecff" stroke-width="3"/><text x="500" y="267" fill="white" text-anchor="middle" font-family="sans-serif" font-size="18">Terre</text><circle cx="500" cy="260" r="185" fill="none" stroke="#789" stroke-dasharray="6 8"/><circle cx="500" cy="75" r="25" fill="#ddd"/><circle cx="685" cy="260" r="25" fill="#ddd"/><circle cx="500" cy="445" r="25" fill="#ddd"/><circle cx="315" cy="260" r="25" fill="#ddd"/><circle cx="369" cy="129" r="25" fill="#ddd"/><circle cx="631" cy="129" r="25" fill="#ddd"/><circle cx="631" cy="391" r="25" fill="#ddd"/><circle cx="369" cy="391" r="25" fill="#ddd"/><g fill="white" font-family="sans-serif" font-size="18" text-anchor="middle"><text x="500" y="38">Pleine Lune</text><text x="735" y="266">Dernier quartier</text><text x="500" y="492">Nouvelle Lune</text><text x="265" y="266">Premier quartier</text><text x="340" y="105">Gibbeuse</text><text x="660" y="105">Gibbeuse</text><text x="660" y="425">Croissant</text><text x="340" y="425">Croissant</text></g><circle cx="55" cy="70" r="25" fill="#ffd35a"/><text x="55" y="115" fill="#ffd35a" font-family="sans-serif" font-size="18" text-anchor="middle">Soleil</text><path d="M82 70H270" stroke="#ffd35a" stroke-width="4" marker-end="url(#a)"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#ffd35a"/></marker></defs><text x="500" y="515" fill="#b9cbe2" text-anchor="middle" font-family="sans-serif" font-size="15">La Lune est toujours éclairée par moitié ; la phase dépend de la portion éclairée visible depuis la Terre.</text></svg>