<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-labelledby="t d"><title id="t">Couleur et température des étoiles</title><desc id="d">Schéma pédagogique indicatif reliant couleur apparente et température de surface.</desc><rect width="1000" height="380" fill="#071326"/><defs><linearGradient id="g"><stop offset="0" stop-color="#e34b35"/><stop offset=".35" stop-color="#f5ad4e"/><stop offset=".58" stop-color="#fff2c2"/><stop offset=".8" stop-color="#cce8ff"/><stop offset="1" stop-color="#6da9ff"/></linearGradient></defs><rect x="120" y="150" width="760" height="65" rx="30" fill="url(#g)"/><g fill="white" font-family="sans-serif" text-anchor="middle" font-size="20"><text x="500" y="55" font-size="24">Température de surface croissante →</text><text x="150" y="270">rouge</text><text x="365" y="270">orange / jaune</text><text x="610" y="270">blanc</text><text x="850" y="270">bleu</text><text x="500" y="340" font-size="16" fill="#b9cbe2">La couleur donne une indication de température ; elle ne suffit pas à caractériser toute l’étoile.</text></g></svg>