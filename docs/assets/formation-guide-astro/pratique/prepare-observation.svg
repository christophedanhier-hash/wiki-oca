<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="t d"><title id="t">Préparer une observation guidée</title><desc id="d">Checklist visuelle des étapes essentielles avant et pendant une observation astronomique.</desc><rect width="1000" height="360" fill="#071326"/><g font-family="sans-serif" text-anchor="middle" fill="white" font-size="18"><circle cx="130" cy="160" r="55" fill="#2d6a8c"/><circle cx="370" cy="160" r="55" fill="#437d55"/><circle cx="610" cy="160" r="55" fill="#8b5e3c"/><circle cx="850" cy="160" r="55" fill="#704c8b"/><text x="130" y="155">1</text><text x="130" y="180">Météo</text><text x="370" y="155">2</text><text x="370" y="180">Ciel visible</text><text x="610" y="155">3</text><text x="610" y="180">Matériel</text><text x="850" y="155">4</text><text x="850" y="180">Groupe</text><text x="500" y="55" font-size="23">Avant de guider</text><text x="500" y="300" fill="#b9cbe2" font-size="17">Vérifier → expliquer → pointer → faire observer → sécuriser</text></g></svg>