<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" role="img" aria-labelledby="title desc"><title id="title">Les quatre compétences du guide astro</title><desc id="desc">Schéma synthétique des compétences comprendre, reconnaître, expliquer et guider.</desc><rect width="1000" height="350" fill="#071326"/><g font-family="sans-serif" text-anchor="middle"><circle cx="500" cy="175" r="60" fill="#ffd35a"/><text x="500" y="170" font-size="18">Guide</text><text x="500" y="193" font-size="18">astro</text><g fill="white" font-size="20"><rect x="70" y="55" width="210" height="75" rx="14" fill="#2d6a8c"/><text x="175" y="100">Comprendre</text><rect x="720" y="55" width="210" height="75" rx="14" fill="#437d55"/><text x="825" y="100">Reconnaître</text><rect x="70" y="220" width="210" height="75" rx="14" fill="#8b5e3c"/><text x="175" y="265">Expliquer</text><rect x="720" y="220" width="210" height="75" rx="14" fill="#704c8b"/><text x="825" y="265">Guider</text></g><g stroke="#ffd35a" stroke-width="3"><line x1="280" y1="95" x2="440" y2="160"/><line x1="720" y1="95" x2="560" y2="160"/><line x1="280" y1="255" x2="440" y2="190"/><line x1="720" y1="255" x2="560" y2="190"/></g></g></svg>