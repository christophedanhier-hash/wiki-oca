<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="t d"><title id="t">Notre position dans la Voie lactée</title><desc id="d">Vue schématique de dessus d’une galaxie spirale barrée et position approximative du Système solaire.</desc><rect width="1000" height="400" fill="#071326"/><ellipse cx="500" cy="200" rx="390" ry="120" fill="#5a3f83" opacity=".45" stroke="#d7ecff" stroke-width="2"/><ellipse cx="500" cy="200" rx="230" ry="70" fill="none" stroke="#d89cff" stroke-width="22" opacity=".65"/><line x1="400" y1="200" x2="600" y2="200" stroke="#ffd35a" stroke-width="18" opacity=".7"/><circle cx="670" cy="150" r="7" fill="#4e8ed8"/><circle cx="500" cy="200" r="28" fill="#ffd35a"/><g fill="white" font-family="sans-serif" text-anchor="middle" font-size="19"><text x="500" y="35">Vue schématique de la Voie lactée</text><text x="700" y="145">Système solaire</text><text x="500" y="250">Bulbe central</text><text x="500" y="360" fill="#b9cbe2" font-size="16">Nous observons le disque depuis l’intérieur : il apparaît comme une bande lumineuse.</text></g></svg>