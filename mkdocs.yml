site_name: Wiki Astronomie — Observatoire Centre Ardenne
site_description: Documentation astronomique de Christophe Danhier, de l'Observatoire Centre Ardenne et du Projet T600
site_author: Christophe Danhier & Bureau Gérard (BAVI LEO)
repo_url: https://github.com/christophedanhier-hash/wiki-oca
edit_uri: edit/main/docs/
copyright: "&copy; 2026 Christophe Danhier &mdash; Documentation via le Bureau Gérard (BAVI LEO)"

theme:
  name: material
  language: fr
  palette:
    primary: teal
    accent: orange
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/christophedanhier-hash
    - icon: fontawesome/solid/globe
      link: https://observatoire-centre-ardenne.be/

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js


nav:
  - 🏠 Accueil: index.md
  - 🔭 Projet T600:
      - Aperçu: t600/index.md
      - Documentation technique: t600/technique.md
      - Formation opérateur: t600/formation-operateur.md
      - 📚 Sources & ethnographie: t600/sources.md
      - 🤖 Analyse Cowork (Copilot):
        - Présentation: t600/cowork/index.md
        - Analyse comparative: t600/cowork/comparative.md
  - 🌌 Activités astronomiques:
      - Vue d’ensemble: astronomie/index.md
      - Observation: astronomie/observation/index.md
      - Astrophotographie: astronomie/astrophotographie/index.md
      - Matériel: astronomie/materiel/index.md
      - Objets célestes: astronomie/objets-celestes/index.md
      - Projets personnels: astronomie/projets-personnels/index.md
  - 🎓 Formation de guide astro:
